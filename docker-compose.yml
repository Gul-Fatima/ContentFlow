services:
  db:
    # pgvector image: Postgres with the vector extension preinstalled,
    # ready for production-grade RAG when you flip VECTOR_STORE to pgvector.
    image: pgvector/pgvector:pg16
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # $$ so the container shell expands POSTGRES_USER from backend/.env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-contentflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the database host is the service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
