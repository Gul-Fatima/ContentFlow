services:
  db:
    # pgvector image: Postgres with the vector extension preinstalled,
    # ready for production-grade RAG when you flip VECTOR_STORE to pgvector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentai
      POSTGRES_PASSWORD: agentai
      POSTGRES_DB: agentai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://agentai:agentai@db:5432/agentai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
